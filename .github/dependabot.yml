version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/web"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
