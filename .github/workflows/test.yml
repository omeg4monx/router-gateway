name: Test

on:
  push:
    branches: [main, migration/next-go]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'

      - name: Verify runtime pins
        run: |
          node --version
          bun --version
          node -e 'if (process.versions.bun || process.version !== "v" + require("node:fs").readFileSync(".nvmrc", "utf8").trim()) process.exit(1)'
          test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"

      - name: Install app deps
        run: test -f bun.lock && bun install --frozen-lockfile

      - name: Install test deps
        working-directory: tests
        run: test -f bun.lock && bun install --frozen-lockfile

      # Run from the repo root: several tests resolve files from process.cwd().
      - name: Unit tests
        run: RUN_REAL=0 bun run test

      - name: Build Next.js
        run: DATA_DIR="$(mktemp -d)" bun run build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Go tests
        run: go test -mod=readonly ./...

      - name: Build Go gateway
        run: go build -mod=readonly -o "$RUNNER_TEMP/omeg4mon-router" ./cmd/omeg4mon-router

      - name: Check Go module files
        run: git diff --exit-code -- go.mod go.sum
