name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # No lockfiles are tracked (both are gitignored); install like the Dockerfile does.
      - name: Install app deps
        run: npm install --no-audit --no-fund

      - name: Install test deps
        run: npm install --no-audit --no-fund
        working-directory: tests

      # Run from the repo root: several tests resolve files from process.cwd().
      # CI=true makes tests/vitest.config.js skip the files in tests/quarantine.js.
      - name: Unit tests
        run: tests/node_modules/.bin/vitest run --config tests/vitest.config.js
