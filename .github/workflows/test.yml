name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # No lockfiles are tracked (both are gitignored); install like the Dockerfile does.
      - name: Install app deps
        run: npm install --no-audit --no-fund

      # A separate `npm install` in tests/ crashes npm's arborist (edgesOut of null)
      # once the root has node_modules; add vitest to the root tree instead,
      # pinned to the range in tests/package.json.
      - name: Install test runner
        run: npm install --no-save --no-audit --no-fund "vitest@$(node -p "require('./tests/package.json').devDependencies.vitest")"

      # Run from the repo root: several tests resolve files from process.cwd().
      # CI=true makes tests/vitest.config.js skip the files in tests/quarantine.js.
      - name: Unit tests
        run: npx vitest run --config tests/vitest.config.js
