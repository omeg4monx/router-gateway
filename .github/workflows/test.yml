name: Test

on:
  push:
    branches: [main, migration/next-go]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install app deps
        run: npx --yes npm@11.20.0 ci

      # npm 10 (bundled with Node 22) crashes resolving vitest 4's tree
      # ("Cannot read properties of null (reading 'edgesOut')"); npm 11 does not.
      - name: Install test deps
        run: npx --yes npm@11.20.0 --prefix tests ci

      # Run from the repo root: several tests resolve files from process.cwd().
      - name: Unit tests
        run: RUN_REAL=0 tests/node_modules/.bin/vitest run --config tests/vitest.config.js

      - name: Build Next.js
        run: DATA_DIR="$(mktemp -d)" npm run build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go tests
        run: go test -mod=readonly ./...

      - name: Build Go gateway
        run: go build -mod=readonly -o "$RUNNER_TEMP/omeg4mon-router" ./cmd/omeg4mon-router

      # Verify cached module content after tests and build have fetched it.
      - name: Verify Go modules
        run: go mod verify

      - name: Check Go module files
        run: git diff --exit-code -- go.mod go.sum
