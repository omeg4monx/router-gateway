name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Maintain Release PR & Tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      used_default_token: ${{ steps.token_mode.outputs.used_default_token }}
    steps:
      - name: Detect token mode
        id: token_mode
        env:
          CUSTOM_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${CUSTOM_TOKEN}" ]; then
            echo "used_default_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "used_default_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: Build & Publish Official Release Artifacts
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.used_default_token == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write
