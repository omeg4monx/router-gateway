services:
  omeg4mon-router:
    build: .
    image: omeg4mon-router:local
    container_name: omeg4mon-router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - omeg4mon-router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  omeg4mon-router-data:
    name: ${OMEG4MON_ROUTER_VOLUME:-omeg4mon-router-data}
