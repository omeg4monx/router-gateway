openapi: 3.1.0
info:
  title: omeg4mon-router Control Plane API
  version: 0.1.0
  description: Modular OpenAPI 3.1 contract for the omeg4mon-router control plane.
servers:
  - url: /
    description: Same-origin router control plane
tags:
  - name: system
    description: Health checks, build version metadata, first-run initialization, and shutdown control
  - name: auth
    description: Single-admin session authentication, password rotation, and login enforcement policy
  - name: settings
    description: Typed control-plane runtime settings, revision history, and atomic rollback
  - name: keys
    description: Gateway API key lifecycle management and secret rotation
  - name: providers
    description: Provider adapter catalog, custom compatible nodes, vaulted connections, connectivity tests, and PKCE OAuth
  - name: combos
    description: Fallback combos, model aliases, disabled models, and upstream connection cooldowns
  - name: usage
    description: Request telemetry logs, aggregated usage statistics, live SSE stream, and model pricing overrides
  - name: clitools
    description: CLI coding-tool configuration generators and loopback-only local apply and rollback
  - name: proxypools
    description: Encrypted HTTP/SOCKS5 outbound proxy pools, latency probes, auto-scanner, and provider bindings
  - name: translator
    description: Interactive wire-protocol translator workbench and live console log SSE stream
  - name: promptinjection
    description: Configurable prompt injection guard rules, dry-run tester, and audit event log
  - name: modeleditor
    description: Custom model parameter overrides, conditional bypass rules, and dry-run preview
  - name: tokensaver
    description: Go-native token compression, Headroom prefix cache affinity, and live savings metrics
  - name: security
    description: Live security posture report and redacted control-plane security audit trail
  - name: notifications
    description: System notifications inbox, live SSE notification stream, and background jobs telemetry
  - name: teams
    description: API-key grouping with shared USD budgets and RPM quotas
  - name: vouchers
    description: Redeemable voucher lifecycle, atomic API-key provisioning, and anti-abuse enforcement
  - name: media
    description: Media gateway providers, fallback combos, audio/image/video/search proxying, and SSRF-safe web fetch
  - name: tunnel
    description: Cloudflare quick tunnel and Tailscale serve/funnel lifecycle manager
  - name: mitm
    description: Local loopback TLS MITM proxy, ECDSA Root CA engine, IDE tool hosts, and model aliases
  - name: pxpipe
    description: In-process request transform pipeline, GatewayInterceptor, live self-test health, and logs
  - name: telegram
    description: Vaulted Telegram Bot controller, fail-closed webhook, command simulator, and eventbus alert forwarding
  - name: arena
    description: Multi-model side-by-side comparison battles, leaderboard, and persistent Basic Chat sessions
  - name: plugins
    description: Configurable gateway request-enhancement plugins and reusable agent/IDE skills catalog
  - name: cloudsync
    description: Vaulted SSRF-safe remote state synchronization and portable JSON snapshot export/restore
  - name: importer
    description: Read-only legacy data.sqlite inspector and one-way control-plane migration tool
