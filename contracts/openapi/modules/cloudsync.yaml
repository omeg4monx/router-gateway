paths:
  /api/cloud-sync/config:
    get:
      operationId: getCloudSyncConfig
      tags: [cloudsync]
      summary: Fetch current Cloud Sync configuration (secrets masked)
      responses:
        '200':
          description: Cloud Sync configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncConfig'
    patch:
      operationId: updateCloudSyncConfig
      tags: [cloudsync]
      summary: Update Cloud Sync remote endpoint, vaulted bearer token, and conflict policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudSyncConfigRequest'
      responses:
        '200':
          description: Updated Cloud Sync configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncConfig'
        '400':
          description: Validation or SSRF policy violation
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/cloud-sync/push:
    post:
      operationId: pushCloudSync
      tags: [cloudsync]
      summary: Push a local state snapshot to the configured remote sync endpoint
      responses:
        '200':
          description: Push completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncActionResponse'
        '400':
          description: Missing or invalid endpoint
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '502':
          description: Remote sync endpoint error
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/cloud-sync/pull:
    post:
      operationId: pullCloudSync
      tags: [cloudsync]
      summary: Pull a remote state snapshot and apply it using the configured conflict policy
      responses:
        '200':
          description: Pull completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncActionResponse'
        '400':
          description: Missing or invalid endpoint
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '502':
          description: Remote sync endpoint error
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/cloud-sync/snapshot:
    get:
      operationId: exportCloudSyncSnapshot
      tags: [cloudsync]
      summary: Export a portable JSON snapshot of control-plane settings, combos, and aliases
      responses:
        '200':
          description: Portable snapshot bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncSnapshotBundle'
  /api/cloud-sync/restore:
    post:
      operationId: restoreCloudSyncSnapshot
      tags: [cloudsync]
      summary: Restore a portable JSON snapshot bundle locally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCloudSyncSnapshotRequest'
      responses:
        '200':
          description: Restore completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncActionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/cloud-sync/history:
    get:
      operationId: listCloudSyncHistory
      tags: [cloudsync]
      summary: List recent Cloud Sync push/pull/export/restore events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Sync history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncHistoryListResponse'
    delete:
      operationId: clearCloudSyncHistory
      tags: [cloudsync]
      summary: Clear all Cloud Sync history events
      responses:
        '200':
          description: Cleared event count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearCloudSyncHistoryResponse'
components:
  schemas:
    CloudSyncConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - endpoint_url
        - has_auth_token
        - auth_token_mask
        - sync_interval_min
        - conflict_policy
        - include_settings
        - include_combos
        - last_sync_at
        - last_status
        - last_error
        - updated_at
      properties:
        enabled:
          type: boolean
        endpoint_url:
          type: string
        has_auth_token:
          type: boolean
        auth_token_mask:
          type: string
        sync_interval_min:
          type: integer
        conflict_policy:
          type: string
          enum: [merge, remote_wins, local_wins]
        include_settings:
          type: boolean
        include_combos:
          type: boolean
        last_sync_at:
          type: string
        last_status:
          type: string
        last_error:
          type: string
        updated_at:
          type: string
    UpdateCloudSyncConfigRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        endpoint_url:
          type: string
        auth_token:
          type: string
        clear_auth_token:
          type: boolean
        sync_interval_min:
          type: integer
        conflict_policy:
          type: string
          enum: [merge, remote_wins, local_wins]
        include_settings:
          type: boolean
        include_combos:
          type: boolean
    CloudSyncComboSnapshot:
      type: object
      additionalProperties: false
      required: [name, description, strategy, targets, enabled]
      properties:
        name:
          type: string
        description:
          type: string
        strategy:
          type: string
        targets:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    CloudSyncAliasSnapshot:
      type: object
      additionalProperties: false
      required: [alias, target_model]
      properties:
        alias:
          type: string
        target_model:
          type: string
    CloudSyncSnapshotBundle:
      type: object
      additionalProperties: false
      required: [version, exported_at, checksum]
      properties:
        version:
          type: integer
        exported_at:
          type: string
        checksum:
          type: string
        settings:
          type: object
          additionalProperties: true
        combos:
          type: array
          items:
            $ref: '#/components/schemas/CloudSyncComboSnapshot'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/CloudSyncAliasSnapshot'
    RestoreCloudSyncSnapshotRequest:
      type: object
      additionalProperties: false
      required: [snapshot]
      properties:
        conflict_policy:
          type: string
          enum: [merge, remote_wins, local_wins]
        snapshot:
          $ref: '#/components/schemas/CloudSyncSnapshotBundle'
    CloudSyncHistoryEvent:
      type: object
      additionalProperties: false
      required: [id, direction, status, summary, checksum, item_count, error, created_at]
      properties:
        id:
          type: string
        direction:
          type: string
        status:
          type: string
        summary:
          type: string
        checksum:
          type: string
        item_count:
          type: integer
        error:
          type: string
        created_at:
          type: string
    CloudSyncActionResponse:
      type: object
      additionalProperties: false
      required: [ok, direction, checksum, item_count, event]
      properties:
        ok:
          type: boolean
        direction:
          type: string
        checksum:
          type: string
        item_count:
          type: integer
        event:
          $ref: '#/components/schemas/CloudSyncHistoryEvent'
    CloudSyncHistoryListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CloudSyncHistoryEvent'
    ClearCloudSyncHistoryResponse:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted:
          type: integer
