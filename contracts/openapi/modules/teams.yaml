openapi: 3.1.0
info:
  title: Teams Module API
  version: 0.1.0
paths:
  /api/teams:
    get:
      operationId: listTeams
      tags:
        - teams
      summary: List API-key teams with shared USD budgets and RPM limits
      responses:
        "200":
          description: Teams list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
    post:
      operationId: createTeam
      tags:
        - teams
      summary: Create a new API-key team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
        "409":
          description: Team name conflict
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
  /api/teams/{id}:
    get:
      operationId: getTeam
      tags:
        - teams
      summary: Get a single team by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateTeam
      tags:
        - teams
      summary: Update team budget, RPM limit, or enabled status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
        "409":
          description: Team name conflict
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteTeam
      tags:
        - teams
      summary: Delete a team and detach its key memberships
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTeamResponse"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
  /api/teams/{id}/keys:
    post:
      operationId: assignKeyToTeam
      tags:
        - teams
      summary: Assign an API key to a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTeamKeyRequest"
      responses:
        "200":
          description: Updated team with assigned key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid key ID
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
  /api/teams/{id}/keys/{keyId}:
    delete:
      operationId: removeKeyFromTeam
      tags:
        - teams
      summary: Remove an API key from a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team or key membership not found
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
  /api/teams/{id}/reset-spend:
    post:
      operationId: resetTeamSpend
      tags:
        - teams
      summary: Reset accumulated USD spend for a team to zero
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated team with reset spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorEnvelope"
components:
  schemas:
    Team:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - budget_usd
        - spent_usd
        - rate_limit_rpm
        - enabled
        - key_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        budget_usd:
          type: number
        spent_usd:
          type: number
        rate_limit_rpm:
          type: integer
        enabled:
          type: boolean
        key_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
        updated_at:
          type: string
    TeamListResponse:
      type: object
      additionalProperties: false
      required:
        - teams
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        budget_usd:
          type: number
        rate_limit_rpm:
          type: integer
        enabled:
          type: boolean
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        budget_usd:
          type: number
        rate_limit_rpm:
          type: integer
        enabled:
          type: boolean
    AssignTeamKeyRequest:
      type: object
      additionalProperties: false
      required:
        - key_id
      properties:
        key_id:
          type: string
    DeleteTeamResponse:
      type: object
      additionalProperties: false
      required:
        - deleted
      properties:
        deleted:
          type: boolean
