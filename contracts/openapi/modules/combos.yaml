openapi: 3.1.0
info:
  title: omeg4mon-router Combos & Routing Module API
  version: 0.1.0
paths:
  /api/combos:
    get:
      operationId: listCombos
      summary: List configured multi-model fallback combos
      tags:
        - combos
      responses:
        '200':
          description: Configured fallback combos ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCombosResponse'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to load fallback combos.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    post:
      operationId: createCombo
      summary: Create a new ordered multi-model fallback combo
      tags:
        - combos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComboRequest'
      responses:
        '201':
          description: Fallback combo created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combo'
        '400':
          description: Malformed request body or validation error.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '409':
          description: A combo with the requested name already exists.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '413':
          description: Request body exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to create fallback combo.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/combos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique combo identifier.
        schema:
          type: string
    get:
      operationId: getCombo
      summary: Retrieve a single fallback combo by ID
      tags:
        - combos
      responses:
        '200':
          description: Fallback combo details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combo'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '404':
          description: Combo not found.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to load combo.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateCombo
      summary: Update a fallback combo name, description, ordered targets, strategy, or enabled state
      tags:
        - combos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComboRequest'
      responses:
        '200':
          description: Fallback combo updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Combo'
        '400':
          description: Malformed request body or validation error.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '404':
          description: Combo not found.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '409':
          description: Updated combo name conflicts with an existing combo.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '413':
          description: Request body exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to update combo.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteCombo
      summary: Permanently delete a fallback combo
      tags:
        - combos
      responses:
        '204':
          description: Combo deleted.
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '404':
          description: Combo not found.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to delete combo.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/models/aliases:
    get:
      operationId: listModelAliases
      summary: List configured model aliases
      tags:
        - combos
      responses:
        '200':
          description: Model aliases ordered alphabetically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelAliasesResponse'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to list model aliases.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/models/aliases/{alias}:
    parameters:
      - name: alias
        in: path
        required: true
        description: Logical alias name (percent-encode '/' if present).
        schema:
          type: string
    put:
      operationId: upsertModelAlias
      summary: Create or update a model alias pointing to a target model, combo, or alias
      tags:
        - combos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertModelAliasRequest'
      responses:
        '200':
          description: Model alias saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAlias'
        '400':
          description: Invalid alias, missing target_model, or self-referential alias.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '413':
          description: Request body exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to persist model alias.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteModelAlias
      summary: Delete a configured model alias
      tags:
        - combos
      responses:
        '204':
          description: Model alias deleted.
        '400':
          description: Invalid alias path parameter.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '404':
          description: Model alias not found.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to delete model alias.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/models/disabled:
    get:
      operationId: listDisabledModels
      summary: List disabled model identifiers suppressed from routing and listing
      tags:
        - combos
      responses:
        '200':
          description: Disabled models ordered alphabetically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDisabledModelsResponse'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to list disabled models.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    put:
      operationId: disableModel
      summary: Disable a bare or provider-qualified model identifier
      tags:
        - combos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableModelRequest'
      responses:
        '200':
          description: Model disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisabledModel'
        '400':
          description: Malformed request body or invalid model identifier.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '413':
          description: Request body exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to disable model.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
    delete:
      operationId: enableModel
      summary: Remove a model identifier from the disabled list (via ?model= query parameter or JSON body)
      tags:
        - combos
      parameters:
        - name: model
          in: query
          required: false
          description: Model identifier to re-enable (supports provider/model containing '/').
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableModelRequest'
      responses:
        '204':
          description: Model removed from disabled list.
        '400':
          description: Missing or invalid model identifier.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '404':
          description: Model is not currently disabled.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to re-enable model.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/models/cooldowns:
    get:
      operationId: listModelCooldowns
      summary: List upstream provider connections currently in failure cooldown
      tags:
        - combos
      responses:
        '200':
          description: Active upstream connection cooldowns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCooldownsResponse'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
  /api/models/cooldowns/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        description: Upstream provider connection identifier to release from cooldown.
        schema:
          type: string
    delete:
      operationId: clearModelCooldown
      summary: Manually clear an upstream connection cooldown window and reset its backoff counter
      tags:
        - combos
      responses:
        '204':
          description: Connection cooldown cleared.
        '400':
          description: Invalid connectionId path parameter.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
        '401':
          description: Administrative authentication is required.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ComboStrategy:
      type: string
      enum:
        - ordered
    Combo:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - targets
        - strategy
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        targets:
          type: array
          minItems: 1
          items:
            type: string
        strategy:
          $ref: '#/components/schemas/ComboStrategy'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListCombosResponse:
      type: object
      additionalProperties: false
      required:
        - combos
      properties:
        combos:
          type: array
          items:
            $ref: '#/components/schemas/Combo'
    CreateComboRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - targets
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        targets:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
        strategy:
          $ref: '#/components/schemas/ComboStrategy'
        enabled:
          type: boolean
          default: true
    UpdateComboRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        targets:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
        strategy:
          $ref: '#/components/schemas/ComboStrategy'
        enabled:
          type: boolean
    ModelAlias:
      type: object
      additionalProperties: false
      required:
        - alias
        - target_model
        - created_at
        - updated_at
      properties:
        alias:
          type: string
        target_model:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListModelAliasesResponse:
      type: object
      additionalProperties: false
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/ModelAlias'
    UpsertModelAliasRequest:
      type: object
      additionalProperties: false
      required:
        - target_model
      properties:
        target_model:
          type: string
          minLength: 1
          maxLength: 128
    DisabledModel:
      type: object
      additionalProperties: false
      required:
        - model
        - reason
        - created_at
      properties:
        model:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    ListDisabledModelsResponse:
      type: object
      additionalProperties: false
      required:
        - disabled_models
      properties:
        disabled_models:
          type: array
          items:
            $ref: '#/components/schemas/DisabledModel'
    DisableModelRequest:
      type: object
      additionalProperties: false
      required:
        - model
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          type: string
          maxLength: 512
    EnableModelRequest:
      type: object
      additionalProperties: false
      required:
        - model
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
    CooldownEntry:
      type: object
      additionalProperties: false
      required:
        - connection_id
        - failures
        - until
        - last_status
        - updated_at
      properties:
        connection_id:
          type: string
        failures:
          type: integer
          minimum: 1
        until:
          type: string
          format: date-time
        last_status:
          type: integer
        updated_at:
          type: string
          format: date-time
    ListCooldownsResponse:
      type: object
      additionalProperties: false
      required:
        - cooldowns
      properties:
        cooldowns:
          type: array
          items:
            $ref: '#/components/schemas/CooldownEntry'
